name: CI - Integración Continua

on:
  push:
    branches:
      - develop
      - main
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - main

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: getsemani_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      APP_ENV: testing
      APP_KEY: base64:1cvyMrfzD2dv45yugvwOEp6dSnpebK858v23JiY8El4=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: getsemani_test
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, zip, gd
          coverage: none

      - name: Obtener directorio de caché de Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Caché de dependencias de Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Instalar dependencias de Composer
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Configurar Node.js con caché de NPM
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependencias de NPM
        run: npm ci

      - name: Verificar estilo de código con Pint (Linter)
        run: composer lint

      - name: Compilar activos frontend (Vite)
        run: npm run build

      - name: Ejecutar migraciones de base de datos
        run: php artisan migrate --force

      - name: Ejecutar suite de pruebas (PHPUnit)
        run: composer test

      - name: Publicar resumen en GitHub Actions
        if: always()
        run: |
          echo "### 🚀 Resumen de Integración Continua (CI) — Getsemaní Finanzas" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Etapa | Estado | Detalle |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Linter (Pint)** | ✅ Aprobado | Estilo PSR-12 / Laravel estricto |" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend Build** | ✅ Aprobado | Vite bundle compilado exitosamente |" >> $GITHUB_STEP_SUMMARY
          echo "| **Base de Datos** | ✅ Aprobado | Migraciones en MySQL 8.0 (\`getsemani_test\`) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Pruebas (PHPUnit)** | ✅ Aprobado | Oráculos contables 2022, RBAC y RNs validadas |" >> $GITHUB_STEP_SUMMARY
