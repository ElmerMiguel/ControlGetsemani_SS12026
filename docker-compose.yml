services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: control_getsemani_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=db
      - DB_PASSWORD=${DB_PASSWORD:-secret}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - getsemani_net

  db:
    image: mysql:8.0
    container_name: control_getsemani_db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-getsemani_dev}
      MYSQL_USER: ${DB_USERNAME:-getsemani}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - getsemani_net

  node:
    image: node:20.19.0
    container_name: control_getsemani_node
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    entrypoint: ["npm"]
    networks:
      - getsemani_net

volumes:
  db_data:
    driver: local

networks:
  getsemani_net:
    driver: bridge
